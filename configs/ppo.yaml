defaults:
- env/robotwin_adjust_bottle@env.train
- env/robotwin_adjust_bottle@env.eval
- model/pi0_5@actor.model
- training_backend/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-3
    env,rollout: 0-3
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:JOINT_RL_RUN}/output
    project_name: structured_PPO_policy_seeds
    logger_backends:
    - tensorboard
  only_eval: false
  val_check_interval: -1
  save_interval: 5
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  enable_offload: false
  train:
    total_num_envs: 24
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 400
    max_steps_per_rollout_epoch: 400
    group_size: ${algorithm.group_size}
    assets_path: ${oc.env:FAILATLAS_ROBOTWIN_ASSETS}
    seeds_path: null
    center_crop: false
    task_config:
      embodiment:
      - franka-panda
      - franka-panda
      - 0.8
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      step_lim: 400
    auto_reset: true
    ignore_terminations: false
    enable_offload: false
    franka_repo: ${oc.env:JOINT_RL_FRANKA_REPO}
    sim_python: ${oc.env:FAILATLAS_SIM_PYTHON}
    rm_url: ${oc.env:JOINT_RM_URL}
    rm_checkpoint_sha256: ${oc.env:FAILATLAS_PPO_RM_FINGERPRINT}
    seed: 2000000100
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${oc.env:JOINT_RL_RUN}/videos/train
    use_fixed_reset_state_ids: false
    reward_source: joint_structured
  eval:
    total_num_envs: 24
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 400
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 400
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    assets_path: ${oc.env:FAILATLAS_ROBOTWIN_ASSETS}
    seeds_path: null
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${oc.env:JOINT_RL_RUN}/videos/eval
    center_crop: false
    task_config:
      embodiment:
      - franka-panda
      - franka-panda
      - 0.8
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
      step_lim: 400
    enable_offload: false
    franka_repo: ${oc.env:JOINT_RL_FRANKA_REPO}
    sim_python: ${oc.env:FAILATLAS_SIM_PYTHON}
    rm_url: ${oc.env:JOINT_RM_URL}
    rm_checkpoint_sha256: ${oc.env:FAILATLAS_PPO_RM_FINGERPRINT}
    seed: 3000000000
    reward_source: joint_structured
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 64
  seed: 1
  enable_offload: false
  model:
    model_path: ${oc.env:FAILATLAS_SFT_CHECKPOINT}
    num_action_chunks: 50
    action_dim: 16
    add_value_head: true
    num_steps: 10
    openpi:
      config_name: pi05_dualfranka_robotwin_head
      num_images_in_input: 3
      noise_level: 0.3
      detach_critic_input: true
      norm_stats_source_dir: ${oc.env:FAILATLAS_NORM_STATS}
      strict_checkpoint: true
      action_horizon: 50
      action_dim: 32
      action_env_dim: 16
      action_chunk: 50
      train_expert_only: false
      noise_method: flow_sde
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    use_orig_params: true
reward:
  use_reward_model: false
critic:
  use_critic_model: false
