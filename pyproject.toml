[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "failatlas"
version = "0.1.0"
description = "Structured reward modeling and policy learning from robot failures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
config = ["PyYAML>=6"]

[project.scripts]
failatlas = "failatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]
